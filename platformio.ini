[platformio]
default_envs = esp32c6

; ─── Waveshare ESP32-C6-LCD-1.47 (Default / Primary Target) ───
[env:esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D HW4
    -D DRIVER_TWAI
    -D TWAI_TX_PIN=0
    -D TWAI_RX_PIN=1
    -D PIN_LED=8
    -D FORCE_FSD
    ; ─── Flipper Zero UART bridge (UART1) ───
    -D FLIPPER_UART_ENABLE
    -D FLIPPER_UART_TX=4
    -D FLIPPER_UART_RX=5
    -D FLIPPER_UART_BAUD=115200
    -D FLIPPER_FW_VERSION=\"0.3.0\"
    -std=gnu++17

build_unflags = -std=gnu++11

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.16.2

board_build.partitions = default.csv

; ─── Waveshare ESP32-S3-Touch-LCD-2 (2.0" 240x320 Capacitive Touch) ───
[env:waveshare_esp32_s3_touch_lcd_2]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D HW4
    -D DRIVER_TWAI
    -D BOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_2
    ; ─── CAN (TWAI) Pins: Header P1 (TX=IO16, RX=IO17) ───
    -D TWAI_TX_PIN=16
    -D TWAI_RX_PIN=17
    ; ─── LCD Display Pins (ST7789T3, 240x320 IPS) ───
    -D LCD_MOSI_PIN=38
    -D LCD_SCK_PIN=39
    -D LCD_MISO_PIN=40
    -D LCD_DC_PIN=42
    -D LCD_RST_PIN=-1
    -D LCD_CS_PIN=45
    -D LCD_BL_PIN=1
    -D LCD_WIDTH=240
    -D LCD_HEIGHT=320
    -D LCD_ROTATION=0
    -D LCD_INVERT=1
    ; ─── Capacitive Touch (CST816D, I2C: SDA=48, SCL=47) ───
    -D TOUCH_ENABLE
    -D TOUCH_SDA_PIN=48
    -D TOUCH_SCL_PIN=47
    -D TOUCH_INT_PIN=46
    ; ─── User LED (none on board; disable GPIO blink) ───
    -D PIN_LED=-1
    -D FORCE_FSD
    ; ─── Flipper Zero UART Bridge (Header P2: TX=IO43, RX=IO44) ───
    -D FLIPPER_UART_ENABLE
    -D FLIPPER_UART_TX=43
    -D FLIPPER_UART_RX=44
    -D FLIPPER_UART_BAUD=115200
    -D FLIPPER_FW_VERSION=\"0.3.0\"
    ; ─── Native USB CDC for flashing & serial monitor ───
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -std=gnu++17

build_unflags = -std=gnu++11

lib_deps =
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    adafruit/Adafruit BusIO@^1.16.2

board_build.partitions = default_16MB.csv
